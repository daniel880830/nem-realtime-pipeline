[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nem-realtime-pipeline"
version = "1.0.0"
description = "ETL + MQTT streaming pipeline for Australia's National Electricity Market (NEM), with a live Streamlit map dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "paho-mqtt>=2.0",
    "pandas>=2.2",
    "pydantic-settings>=2.4",
    "pydeck>=0.9",
    "rapidfuzz>=3.9",
    "requests>=2.32",
    "streamlit>=1.40",
    "streamlit-autorefresh>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
nem-pipeline = "nem_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "PTH", "RUF"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["integration: end-to-end tests on synthetic data"]

[tool.coverage.run]
source = ["nem_pipeline"]
omit = ["*/dashboard/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
